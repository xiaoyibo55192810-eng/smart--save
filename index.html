<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Smart Savings</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/browser@1.12.0/build/stlite.css" />
</head>
<body>
  <div id="root"></div>
  <script type="module">
    // Runs app.py in the browser with stlite (Streamlit on Pyodide), so it can be hosted on GitHub Pages.
    import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@1.12.0/build/stlite.js";
    mount(
      {
        requirements: ["pandas", "scikit-learn", "joblib"],
        entrypoint: "app.py",
        files: {
          "app.py": { url: "./app.py" },
          "savings_model.joblib": { url: "./savings_model.joblib" },
          "saver_model.joblib": { url: "./saver_model.joblib" },
          "customers_with_groups.csv": { url: "./customers_with_groups.csv" },
          ".streamlit/config.toml": { url: "./.streamlit/config.toml" },
        },
      },
      document.getElementById("root")
    );
  </script>
</body>
</html>
